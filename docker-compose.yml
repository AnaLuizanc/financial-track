services:
  fin-track:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"

  fin-track-dev:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - fin_track_node_modules:/app/node_modules
    command: sh -lc "npm ci && npm run start -- --host 0.0.0.0 --port 4200"

volumes:
  fin_track_node_modules:
